[package]
name = "firecracker-uefi-vars"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
aws-lc-rs = "=1.18.0"
cms = "0.2.3"
der = "0.7.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = "0.2.5"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
