[package]
name = "firecracker-qxl-driver"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[workspace]

[features]
miniport = []

[[bin]]
name = "qxl-miniport"
path = "driver/miniport.rs"
required-features = ["miniport"]
test = false
bench = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
panic = "abort"
lto = true

[profile.dev]
panic = "abort"
