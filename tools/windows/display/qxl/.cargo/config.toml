[target.i686-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=lld-link",
    "-C", "default-linker-libraries=no",
    "-C", "llvm-args=-force-attribute=noimplicitfloat",
]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=lld-link",
    "-C", "default-linker-libraries=no",
    "-C", "llvm-args=-force-attribute=noimplicitfloat",
]
